name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API and development dependencies
        working-directory: apps/api
        run: python -m pip install -e ".[dev]" pip-audit
      - name: Unit and workflow tests
        working-directory: apps/api
        run: python -m pytest tests -q
      - name: Lint and formatting
        working-directory: apps/api
        run: |
          python -m ruff check src tests migrations
          python -m ruff format --check src tests migrations
      - name: Dependency security audit
        working-directory: apps/api
        run: python -m pip_audit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Type check
        working-directory: apps/web
        run: pnpm run typecheck
      - name: Production build
        working-directory: apps/web
        run: pnpm run build
      - name: Dependency security audit
        working-directory: apps/web
        run: pnpm audit --prod --audit-level high

