[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "migrateai-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.9,<1", "SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "redis>=5,<6", "python-dotenv>=1,<2", "pwdlib[argon2]>=0.2,<1", "email-validator>=2.2,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["B008", "E501"]
